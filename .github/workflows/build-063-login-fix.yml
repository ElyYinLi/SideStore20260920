name: Build SideStore 0.6.3 + login fix

# Builds the 0.6.3 tag with the Apple sign-in fix applied.
#
# Upstream (0.7.0 nightly) did NOT switch the marker to akd: it bumped the
# client info / user agent to the current macOS 26.6 / Xcode 26.0 values.
# On top of that, 0.6.3 force-unwraps half of the anisette flow, so any
# unexpected server reply traps (EXC_BREAKPOINT) instead of showing an
# error - the patch also makes that path fail loudly instead of crashing.
# 0.6.3 is kept because its refresh / VPN flow still works on iOS 17.x.
#
# Variants: official (default) / server / none (control build).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-063-login-fix.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image (macos-26 or macos-15)'
        required: false
        default: 'macos-26'
      xcode:
        description: 'Xcode version'
        required: false
        default: '26.4'
      publish_release:
        description: 'Also publish the IPA as a GitHub Release'
        required: false
        default: 'true'
      patch_mode:
        description: 'How much of the login fix to apply'
        required: false
        default: 'official'
        type: choice
        options:
          - official
          - server
          - none

permissions:
  contents: write

concurrency:
  group: build-063-login-fix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # official = safety rewrite + official client info/user agent + clear the stale adi.pb once
      # server   = safety rewrite only (keeps whatever the anisette server reports)
      # none     = untouched 0.6.3, used as a control build
      PATCH_MODE: ${{ inputs.patch_mode || 'official' }}
      # The only em_proxy release that still ships libem_proxy-*.a / em_proxy.h.
      EM_PROXY_BASE: https://github.com/SideStore/em_proxy/releases/download/build

    steps:
      - name: Resolve variant names
        run: |
          case "$PATCH_MODE" in
            official) suffix="official" ;;
            server)   suffix="server" ;;
            none)     suffix="clean" ;;
            *) echo "ERROR: unknown PATCH_MODE=$PATCH_MODE"; exit 1 ;;
          esac
          # v6 = AltSign request headers + response parsing fixed as well.
          # The series is part of both the file name and the release tag so a
          # rerun never silently overwrites an earlier build.
          series="v6"
          echo "IPA_NAME=SideStore-0.6.3-$suffix-$series.ipa" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=SideStore-0.6.3-$suffix-$series" >> "$GITHUB_ENV"
          echo "VARIANT_TAG=0.6.3-$suffix-$series" >> "$GITHUB_ENV"
          echo "building variant: $suffix-$series (patch mode: $PATCH_MODE)"

      - name: Checkout 0.6.3 (with submodules)
        uses: actions/checkout@v4
        with:
          ref: '0.6.3'
          submodules: recursive
          fetch-depth: 0


      - name: Apply login fix (official client info + crash hardening)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fix063.py" <<'PYEOF'
          #!/usr/bin/env python3
          """Backport the Apple sign-in fix onto a 0.6.3 checkout.

          What upstream actually did (0.7.0 nightly, Sept 2026) is NOT switching the
          marker to akd - it bumped the client info / user agent to the current macOS
          26.6 / Xcode 26.0 values. This patch does that, and additionally removes the
          force unwraps that make 0.6.3 crash (EXC_BREAKPOINT on the NSURLSession
          delegate queue) instead of showing an error.

          Modes:
            official -> safety rewrite + official client info/user agent + reset adi.pb
            server   -> safety rewrite only (keep whatever the anisette server reports)
            none     -> untouched 0.6.3 (control build)
          """
          import os
          import sys
          from pathlib import Path

          TARGET = Path("AltStore/Operations/FetchAnisetteDataOperation.swift")

          CLIENT_INFO = r'''    // MARK: - Apple sign-in fix (official client info + crash hardening)

              /// The client info / user agent upstream ships today (0.7.0 nightly).
              /// Apple rejects sign-in (HTTP 503) when these still carry the old
              /// (com.apple.dt.Xcode/<old version>) marker, so pin the current values.
              static let appleClientInfo = "<MacBookPro18,3> <macOS;26.6;25F84> <com.apple.AuthKit/1 (com.apple.dt.Xcode/26.0)>"
              static let appleUserAgent = "AuthKit/1 (Macintosh; OS X 26.6) (com.apple.dt.Xcode/26.0)"

              /// Anisette servers occasionally report non-string values; read them
              /// defensively instead of trapping on a failed downcast.
              static func stringValue(_ any: Any?) -> String? {
                  if let string = any as? String { return string }
                  if let number = any as? NSNumber { return number.stringValue }
                  return nil
              }

              /// Data.object() traps when the buffer is shorter than the target type,
              /// which is one of the crashes seen on device. Build the UUID safely.
              static func safeUUIDString(from data: Data) -> String? {
                  guard data.count >= 16 else { return nil }
                  var bytes = [UInt8](repeating: 0, count: 16)
                  data.copyBytes(to: &bytes, count: 16)
                  return NSUUID(uuidBytes: bytes).uuidString.uppercased()
              }

              /// adi.pb is bound to the client info it was provisioned with, so an
              /// identity provisioned with an old marker has to be discarded once.
              static func resetAnisetteIdentityOnce() {
                  let migrationKey = "AnisetteClientInfoMigrated2026"
                  guard !UserDefaults.standard.bool(forKey: migrationKey) else { return }
                  Keychain.shared.adiPb = nil
                  UserDefaults.standard.set(true, forKey: migrationKey)
              }

              private func ensureIdentifier() -> Bool {
                  if let existing = Keychain.shared.identifier,
                     let decoded = Data(base64Encoded: existing),
                     decoded.count >= 16 {
                      return true
                  }
                  self.printOut("Generating identifier")
                  var bytes = [Int8](repeating: 0, count: 16)
                  let status = SecRandomCopyBytes(kSecRandomDefault, bytes.count, &bytes)
                  if status != errSecSuccess {
                      self.printOut("ERROR GENERATING IDENTIFIER!!! \(status)")
                      return false
                  }
                  Keychain.shared.identifier = Data(bytes: &bytes, count: bytes.count).base64EncodedString()
                  return true
              }

              private func deriveDeviceIdentifiers() -> Bool {
                  guard ensureIdentifier(),
                        let identifier = Keychain.shared.identifier,
                        let decoded = Data(base64Encoded: identifier),
                        decoded.count >= 16,
                        let deviceId = Self.safeUUIDString(from: decoded) else {
                      return false
                  }
                  self.mdLu = decoded.sha256().hexEncodedString()
                  self.deviceId = deviceId
                  self.printOut("X-Apple-I-MD-LU: \(self.mdLu ?? "none")")
                  self.printOut("X-Mme-Device-Id: \(deviceId)")
                  return true
              }

          '''

          SAFETY = [
              (
                  "main(): error! on missing server",
                  [
                      '            guard let urlString = url else {',
                      '                self.finish(.failure(error!))',
                      '                return',
                      '            }',
                  ],
                  [
                      '            guard let urlString = url else {',
                      '                self.finish(.failure(error ?? OperationError.anisetteV3Error(message: "No anisette server could be reached")))',
                      '                return',
                      '            }',
                  ],
              ),
              (
                  "main(): url! log line",
                  ['            self.printOut("Anisette URL: \\(self.url!.absoluteString)")'],
                  ['            self.printOut("Anisette URL: \\(self.url?.absoluteString ?? "none")")'],
              ),
              (
                  "extractAnisetteData: [String: String] downcast",
                  [
                      '        if let json = try JSONSerialization.jsonObject(with: data, options: []) as? [String: String] {',
                  ],
                  [
                      '        if let rawJSON = try? JSONSerialization.jsonObject(with: data, options: []),',
                      '           let anyJSON = rawJSON as? [String: Any] {',
                      '            var json: [String: String] = [:]',
                      '            for (jsonKey, jsonValue) in anyJSON {',
                      '                if let jsonString = Self.stringValue(jsonValue) { json[jsonKey] = jsonString }',
                      '            }',
                  ],
              ),
              (
                  "extractAnisetteData: v3 force unwraps",
                  [
                      '                formattedJSON["deviceDescription"] = self.clientInfo!',
                      '                formattedJSON["localUserID"] = self.mdLu!',
                      '                formattedJSON["deviceUniqueIdentifier"] = self.deviceId!',
                  ],
                  [
                      '                guard let deviceDescription = self.clientInfo,',
                      '                      let localUserID = self.mdLu,',
                      '                      let deviceUniqueIdentifier = self.deviceId else {',
                      '                    throw OperationError.anisetteV3Error(message: "Missing anisette client info (device description, local user id or device id)")',
                      '                }',
                      '                formattedJSON["deviceDescription"] = deviceDescription',
                      '                formattedJSON["localUserID"] = localUserID',
                      '                formattedJSON["deviceUniqueIdentifier"] = deviceUniqueIdentifier',
                  ],
              ),
              (
                  "fetchAnisetteV1: url!",
                  ['        URLSession.shared.dataTask(with: self.url!) { data, response, error in'],
                  [
                      '        guard let requestURL = self.url else {',
                      '            return self.finish(.failure(OperationError.anisetteV1Error(message: "No anisette server URL is available")))',
                      '        }',
                      '        URLSession.shared.dataTask(with: requestURL) { data, response, error in',
                  ],
              ),
              (
                  "provision: nested plist downcast",
                  [
                      '                if let data = data,',
                      '                   let plist = try? PropertyListSerialization.propertyList(from: data, format: nil) as? Dictionary<String, Dictionary<String, Any>>,',
                      '                   let startProvisioningString = plist["urls"]?["midStartProvisioning"] as? String,',
                      '                   let startProvisioningURL = URL(string: startProvisioningString),',
                      '                   let endProvisioningString = plist["urls"]?["midFinishProvisioning"] as? String,',
                      '                   let endProvisioningURL = URL(string: endProvisioningString) {',
                  ],
                  [
                      '                if let data = data,',
                      '                   let rawPlist = try? PropertyListSerialization.propertyList(from: data, format: nil),',
                      '                   let plist = rawPlist as? Dictionary<String, Any>,',
                      '                   let urls = plist["urls"] as? Dictionary<String, Any>,',
                      '                   let startProvisioningString = urls["midStartProvisioning"] as? String,',
                      '                   let startProvisioningURL = URL(string: startProvisioningString),',
                      '                   let endProvisioningString = urls["midFinishProvisioning"] as? String,',
                      '                   let endProvisioningURL = URL(string: endProvisioningString) {',
                  ],
              ),
              (
                  "provision: provisioning URL logs",
                  [
                      '                    self.printOut("startProvisioningURL: \\(self.startProvisioningURL!.absoluteString)")',
                      '                    self.printOut("endProvisioningURL: \\(self.endProvisioningURL!.absoluteString)")',
                  ],
                  [
                      '                    self.printOut("startProvisioningURL: \\(self.startProvisioningURL?.absoluteString ?? "none")")',
                      '                    self.printOut("endProvisioningURL: \\(self.endProvisioningURL?.absoluteString ?? "none")")',
                  ],
              ),
              (
                  "startProvisioningSession: url!",
                  [
                      '        let provisioningSessionURL = self.url!.appendingPathComponent("v3").appendingPathComponent("provisioning_session")',
                  ],
                  [
                      '        guard let baseURL = self.url else {',
                      '            return self.finish(.failure(OperationError.provisioningError(result: "No anisette server URL is available", message: nil)))',
                      '        }',
                      '        let provisioningSessionURL = baseURL.appendingPathComponent("v3").appendingPathComponent("provisioning_session")',
                  ],
              ),
              (
                  "didReceive: websocket text downcast",
                  [
                      '                if let json = try JSONSerialization.jsonObject(with: string.data(using: .utf8)!, options: []) as? [String: Any] {',
                  ],
                  [
                      '                if let messageData = string.data(using: .utf8),',
                      '                   let rawJSON = try? JSONSerialization.jsonObject(with: messageData, options: []),',
                      '                   let json = rawJSON as? [String: Any] {',
                  ],
              ),
              (
                  "didReceive GiveIdentifier: identifier!",
                  ['                        client.json(["identifier": Keychain.shared.identifier!])'],
                  [
                      '                        guard let identifier = Keychain.shared.identifier else {',
                      '                            self.printOut("No device identifier is available")',
                      '                            client.disconnect(closeCode: 0)',
                      '                            self.finish(.failure(OperationError.provisioningError(result: "No device identifier is available", message: nil)))',
                      '                            return',
                      '                        }',
                      '                        client.json(["identifier": identifier])',
                  ],
              ),
              (
                  "didReceive GiveStartProvisioningData: startProvisioningURL!",
                  ['                        var request = self.buildAppleRequest(url: self.startProvisioningURL!)'],
                  [
                      '                        guard let startProvisioningURL = self.startProvisioningURL else {',
                      '                            self.printOut("Missing the start provisioning URL")',
                      '                            client.disconnect(closeCode: 0)',
                      '                            self.finish(.failure(OperationError.provisioningError(result: "Missing the start provisioning URL", message: nil)))',
                      '                            return',
                      '                        }',
                      '                        var request = self.buildAppleRequest(url: startProvisioningURL)',
                  ],
              ),
              (
                  "didReceive GiveStartProvisioningData: nested plist downcast",
                  [
                      '                            if let data = data,',
                      '                               let plist = try? PropertyListSerialization.propertyList(from: data, format: nil) as? Dictionary<String, Dictionary<String, Any>>,',
                      '                               let spim = plist["Response"]?["spim"] as? String {',
                  ],
                  [
                      '                            if let data = data,',
                      '                               let rawPlist = try? PropertyListSerialization.propertyList(from: data, format: nil),',
                      '                               let plist = rawPlist as? Dictionary<String, Any>,',
                      '                               let responseDict = plist["Response"] as? Dictionary<String, Any>,',
                      '                               let spim = responseDict["spim"] as? String {',
                  ],
              ),
              (
                  "didReceive GiveEndProvisioningData: endProvisioningURL!",
                  ['                        var request = self.buildAppleRequest(url: self.endProvisioningURL!)'],
                  [
                      '                        guard let endProvisioningURL = self.endProvisioningURL else {',
                      '                            self.printOut("Missing the end provisioning URL")',
                      '                            client.disconnect(closeCode: 0)',
                      '                            self.finish(.failure(OperationError.provisioningError(result: "Missing the end provisioning URL", message: nil)))',
                      '                            return',
                      '                        }',
                      '                        var request = self.buildAppleRequest(url: endProvisioningURL)',
                  ],
              ),
              (
                  "didReceive GiveEndProvisioningData: nested plist downcast",
                  [
                      '                               let plist = try? PropertyListSerialization.propertyList(from: data, format: nil) as? Dictionary<String, Dictionary<String, Any>>,',
                      '                               let ptm = plist["Response"]?["ptm"] as? String,',
                      '                               let tk = plist["Response"]?["tk"] as? String {',
                  ],
                  [
                      '                               let rawPlist = try? PropertyListSerialization.propertyList(from: data, format: nil),',
                      '                               let plist = rawPlist as? Dictionary<String, Any>,',
                      '                               let responseDict = plist["Response"] as? Dictionary<String, Any>,',
                      '                               let ptm = responseDict["ptm"] as? String,',
                      '                               let tk = responseDict["tk"] as? String {',
                  ],
              ),
              (
                  "didReceive ProvisioningSuccess: identifier! / adiPb!",
                  ['                        self.fetchAnisetteV3(Keychain.shared.identifier!, Keychain.shared.adiPb!)'],
                  [
                      '                        guard let identifier = Keychain.shared.identifier else {',
                      '                            self.printOut("No device identifier is available")',
                      '                            self.finish(.failure(OperationError.provisioningError(result: "No device identifier is available", message: nil)))',
                      '                            return',
                      '                        }',
                      '                        self.fetchAnisetteV3(identifier, adiPb)',
                  ],
              ),
              (
                  "buildAppleRequest: client info / user agent headers",
                  [
                      '        request.setValue(self.clientInfo!, forHTTPHeaderField: "X-Mme-Client-Info")',
                      '        request.setValue(self.userAgent!, forHTTPHeaderField: "User-Agent")',
                  ],
                  [
                      '        request.setValue(self.clientInfo ?? Self.appleClientInfo, forHTTPHeaderField: "X-Mme-Client-Info")',
                      '        request.setValue(self.userAgent ?? Self.appleUserAgent, forHTTPHeaderField: "User-Agent")',
                  ],
              ),
              (
                  "buildAppleRequest: mdLu / deviceId headers",
                  [
                      '        request.setValue(self.mdLu!, forHTTPHeaderField: "X-Apple-I-MD-LU")',
                      '        request.setValue(self.deviceId!, forHTTPHeaderField: "X-Mme-Device-Id")',
                  ],
                  [
                      '        request.setValue(self.mdLu ?? "", forHTTPHeaderField: "X-Apple-I-MD-LU")',
                      '        request.setValue(self.deviceId ?? "", forHTTPHeaderField: "X-Mme-Device-Id")',
                  ],
              ),
              (
                  "fetchClientInfo: url!",
                  ['        let clientInfoURL = self.url!.appendingPathComponent("v3").appendingPathComponent("client_info")'],
                  [
                      '        guard let baseURL = self.url else {',
                      '            return self.finish(.failure(OperationError.anisetteV3Error(message: "No anisette server URL is available")))',
                      '        }',
                      '        let clientInfoURL = baseURL.appendingPathComponent("v3").appendingPathComponent("client_info")',
                  ],
              ),
              (
                  "fetchClientInfo: [String: String] downcast",
                  [
                      '                if let json = try JSONSerialization.jsonObject(with: data, options: []) as? [String: String] {',
                      '                    if let clientInfo = json["client_info"] {',
                  ],
                  [
                      '                if let rawJSON = try? JSONSerialization.jsonObject(with: data, options: []),',
                      '                   let anyJSON = rawJSON as? [String: Any] {',
                      '                    var json: [String: String] = [:]',
                      '                    for (jsonKey, jsonValue) in anyJSON {',
                      '                        if let jsonString = Self.stringValue(jsonValue) { json[jsonKey] = jsonString }',
                      '                    }',
                      '                    if let clientInfo = json["client_info"] {',
                  ],
              ),
              (
                  "fetchClientInfo: identifier / uuid derivation",
                  [
                      '                        if Keychain.shared.identifier == nil {',
                      '                            self.printOut("Generating identifier")',
                      '                            var bytes = [Int8](repeating: 0, count: 16)',
                      '                            let status = SecRandomCopyBytes(kSecRandomDefault, bytes.count, &bytes)',
                      '                            ',
                      '                            if status != errSecSuccess {',
                      '                                self.printOut("ERROR GENERATING IDENTIFIER!!! \\(status)")',
                      '                                return self.finish(.failure(OperationError.provisioningError(result: "Couldn\'t generate identifier", message: nil)))',
                      '                            }',
                      '                            ',
                      '                            Keychain.shared.identifier = Data(bytes: &bytes, count: bytes.count).base64EncodedString()',
                      '                        }',
                      '                        ',
                      '                        let decoded = Data(base64Encoded: Keychain.shared.identifier!)!',
                      '                        self.mdLu = decoded.sha256().hexEncodedString()',
                      '                        self.printOut("X-Apple-I-MD-LU: \\(self.mdLu!)")',
                      '                        let uuid: UUID = decoded.object()',
                      '                        self.deviceId = uuid.uuidString.uppercased()',
                      '                        self.printOut("X-Mme-Device-Id: \\(self.deviceId!)")',
                  ],
                  [
                      '                        guard self.deriveDeviceIdentifiers() else {',
                      '                            self.finish(.failure(OperationError.provisioningError(result: "Couldn\'t derive the device identifiers", message: nil)))',
                      '                            return',
                      '                        }',
                  ],
              ),
              (
                  "fetchAnisetteV3: url!",
                  ['            var request = URLRequest(url: self.url!.appendingPathComponent("v3").appendingPathComponent("get_headers"))'],
                  [
                      '            guard let baseURL = self.url else {',
                      '                return self.finish(.failure(OperationError.anisetteV3Error(message: "No anisette server URL is available")))',
                      '            }',
                      '            var request = URLRequest(url: baseURL.appendingPathComponent("v3").appendingPathComponent("get_headers"))',
                  ],
              ),
          ]

          # Applied only when the client info is overridden with the official values.
          CLIENT_INFO_SWAP = (
              "fetchClientInfo: pin the official client info / user agent",
              [
                  '                        self.clientInfo = clientInfo',
                  '                        self.userAgent = json["user_agent"]!',
                  '                        self.printOut("Client-Info: \\(self.clientInfo!)")',
                  '                        self.printOut("User-Agent: \\(self.userAgent!)")',
              ],
              [
                  '                        self.printOut("Server-reported Client-Info: \\(clientInfo)")',
                  '                        self.clientInfo = Self.appleClientInfo',
                  '                        self.userAgent = json["user_agent"] ?? Self.appleUserAgent',
                  '                        self.printOut("Client-Info: \\(self.clientInfo ?? "none")")',
                  '                        self.printOut("User-Agent: \\(self.userAgent ?? "none")")',
              ],
          )

          CLIENT_INFO_FALLBACK = (
              "fetchClientInfo: keep server values but never force unwrap",
              [
                  '                        self.clientInfo = clientInfo',
                  '                        self.userAgent = json["user_agent"]!',
                  '                        self.printOut("Client-Info: \\(self.clientInfo!)")',
                  '                        self.printOut("User-Agent: \\(self.userAgent!)")',
              ],
              [
                  '                        self.printOut("Server-reported Client-Info: \\(clientInfo)")',
                  '                        self.clientInfo = clientInfo',
                  '                        self.userAgent = json["user_agent"] ?? Self.appleUserAgent',
                  '                        self.printOut("Client-Info: \\(self.clientInfo ?? "none")")',
                  '                        self.printOut("User-Agent: \\(self.userAgent ?? "none")")',
              ],
          )


          def find_block(lines, old_lines):
              """Locate old_lines in lines, ignoring trailing whitespace. Returns (index, unique)."""
              n = len(old_lines)
              hits = []
              for i in range(0, len(lines) - n + 1):
                  if all(lines[i + j].rstrip() == old_lines[j].rstrip() for j in range(n)):
                      hits.append(i)
              return hits


          def apply(lines, label, old_lines, new_lines):
              hits = find_block(lines, old_lines)
              if not hits:
                  print("ERROR: block not found -> %s" % label)
                  print("       first line: %r" % old_lines[0])
                  return None
              if len(hits) > 1:
                  print("ERROR: block is ambiguous (%d matches) -> %s" % (len(hits), label))
                  return None
              i = hits[0]
              out = lines[:i] + list(new_lines) + lines[i + len(old_lines):]
              print("+ %s" % label)
              return out


          def main():
              mode = os.environ.get("PATCH_MODE", "official").strip().lower()
              if mode not in ("official", "server", "none"):
                  print("ERROR: unknown PATCH_MODE: %r" % mode)
                  return 1

              if mode == "none":
                  print("= control build requested: source left untouched")
                  return 0

              if not TARGET.is_file():
                  print("ERROR: %s not found (run me from the repo root)" % TARGET)
                  return 1

              lines = TARGET.read_text(encoding="utf-8").split("\n")
              original = list(lines)

              if "appleClientInfo" in "\n".join(lines):
                  print("= helpers already present")
              else:
                  anchor = "    // MARK: - COMMON"
                  idx = [i for i, l in enumerate(lines) if l.rstrip() == anchor]
                  if not idx:
                      print("ERROR: missing the '// MARK: - COMMON' anchor")
                      return 1
                  i = idx[0]
                  lines = lines[:i] + CLIENT_INFO.rstrip("\n").split("\n") + [""] + lines[i:]
                  print("+ inserted the official client info + hardening helpers")

              swap = CLIENT_INFO_SWAP if mode == "official" else CLIENT_INFO_FALLBACK
              for label, old_lines, new_lines in SAFETY + [swap]:
                  lines = apply(lines, label, old_lines, new_lines)
                  if lines is None:
                      return 1

              if mode in ("official", "server"):
                  anchor = "        super.main()\n"
                  idx = [i for i, l in enumerate(lines) if l.rstrip() == "        super.main()"]
                  if not idx:
                      print("ERROR: missing 'super.main()'")
                      return 1
                  i = idx[0]
                  injected = [
                      '        super.main()',
                      '',
                      '        // Apple sign-in fix: drop the adi.pb that was provisioned with an',
                      '        // outdated client info, so we provision again with the current one.',
                      '        Self.resetAnisetteIdentityOnce()',
                  ]
                  lines = lines[:i] + injected + lines[i + 1:]
                  print("+ hooked resetAnisetteIdentityOnce() into main()")

              if lines == original:
                  print("nothing to do, tree already patched")
                  return 0

              TARGET.write_text("\n".join(lines), encoding="utf-8")
              print("patched %s" % TARGET)
              return 0


          sys.exit(main())
          PYEOF
          python3 "$RUNNER_TEMP/fix063.py"
      - name: Patch AltSign login request (headers + response parsing)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/fix_altsign.py" <<'PYEOF'
          #!/usr/bin/env python3
          """
          Patch the AltSign submodule so 0.6.3's login request matches upstream SideSign.

          0.6.3 does not talk to Apple itself: it hands the anisette data to
          `ALTAppleAPI.authenticate` in the AltSign submodule, and that code carries a
          2018-era User-Agent and only knows how to parse plists. Apple now answers with
          something that is not a plist, so AltSign throws NSError 3840
          ("The data couldn't be read because it isn't in the correct format.").

          Upstream never fixed AltSign - they rewrote the whole login stack as the
          SideSign package (used by 0.7.0-alpha / nightly). This script back-ports the
          five differences that actually matter, plus a diagnostic error so a future
          failure tells us what Apple returned instead of a generic message.

          File patched: Dependencies/AltSign/AltSign/Sources/ALTAppleAPI+Authentication.swift
          Skipped entirely when PATCH_MODE=none (control build).
          """

          import os
          import sys

          TARGET = "Dependencies/AltSign/AltSign/Sources/ALTAppleAPI+Authentication.swift"

          # Verbatim from SideSign/Sources/Constants.swift (GrandSlam.userAgent).
          OFFICIAL_UA = "AuthKit/1 (Macintosh; OS X 26.6) (com.apple.dt.Xcode/26.0)"
          # SideStore/Core/Anisette/AnisetteConfigManager.swift:
          #   return loadConfig().customXcodeVersion ?? "26.0 (26A242)"
          OFFICIAL_XCODE_VERSION = "26.0 (26A242)"

          HELPERS = """    /// Upstream SideSign accepts either format; the original code only accepted
              /// plists and blew up with NSError 3840 whenever Apple answered differently.
              /// Declared `fileprivate` on purpose: the call sites live in another
              /// extension of ALTAppleAPI, and relying on `private`'s cross-extension
              /// scoping rules is exactly the kind of thing that fails to compile.
              fileprivate static func ss_parsePlistOrJSON(_ data: Data) -> [String: Any]? {
                  if let plist = try? PropertyListSerialization.propertyList(from: data, format: nil),
                     let dictionary = plist as? [String: Any]
                  {
                      return dictionary
                  }
                  if let json = try? JSONSerialization.jsonObject(with: data, options: []),
                     let dictionary = json as? [String: Any]
                  {
                      return dictionary
                  }
                  return nil
              }

              /// Surface Apple's actual answer (status code + first bytes) in the alert the
              /// user sees, so a failure can be diagnosed without a device log.
              fileprivate static func ss_diagnosticError(_ prefix: String, statusCode: Int, data: Data) -> NSError {
                  var snippet = String(data: data.prefix(200), encoding: .utf8) ?? ""
                  snippet = snippet.trimmingCharacters(in: .whitespacesAndNewlines)
                  if snippet.isEmpty {
                      snippet = data.prefix(64).map { String(format: "%02x", $0) }.joined()
                  }
                  let message = "\\(prefix) [HTTP \\(statusCode)] \\(snippet)"
                  return NSError(domain: ALTUnderlyingAppleAPIErrorDomain, code: -1,
                                 userInfo: [NSLocalizedDescriptionKey: message])
              }
          """

          # (label, old, new) - every old block must be found exactly once.
          REPLACEMENTS = [
              (
                  "1. auth request: modern User-Agent + Connection: close",
                  """            let httpHeaders = [
                          "Content-Type": "text/x-xml-plist",
                          "X-MMe-Client-Info": anisetteData.deviceDescription,
                          "Accept": "*/*",
                          "User-Agent": "akd/1.0 CFNetwork/978.0.7 Darwin/18.7.0"
                      ]""",
                  """            let httpHeaders = [
                          "Content-Type": "text/x-xml-plist",
                          "X-MMe-Client-Info": anisetteData.deviceDescription,
                          "Accept": "*/*",
                          "User-Agent": "%s",
                          "Connection": "close"
                      ]""" % OFFICIAL_UA,
              ),
              (
                  "2. auth response: accept plist or JSON, report Apple's raw answer",
                  """                    guard let data = data else { throw error ?? ALTAppleAPIError.unknown() }
                              
                              guard let responseDictionary = try PropertyListSerialization.propertyList(from: data, format: nil) as? [String: Any],
                                    let dictionary = responseDictionary["Response"] as? [String: Any],
                                    let status = dictionary["Status"] as? [String: Any]
                              else { throw URLError(.badServerResponse) }""",
                  """                    guard let data = data else { throw error ?? ALTAppleAPIError.unknown() }
                              
                              let httpStatusCode = (response as? HTTPURLResponse)?.statusCode ?? 0
                              
                              if data.isEmpty {
                                  throw Self.ss_diagnosticError("Apple 登录服务返回了空响应", statusCode: httpStatusCode, data: data)
                              }
                              
                              guard let responseDictionary = Self.ss_parsePlistOrJSON(data),
                                    let dictionary = responseDictionary["Response"] as? [String: Any],
                                    let status = dictionary["Status"] as? [String: Any]
                              else {
                                  throw Self.ss_diagnosticError("无法解析 Apple 登录服务的响应（既不是 plist 也不是 JSON）", statusCode: httpStatusCode, data: data)
                              }""",
              ),
              (
                  "3. decrypted spd payload: accept plist or JSON",
                  """                            guard let decryptedDictionary = try PropertyListSerialization.propertyList(from: decryptedData, format: nil) as? [String: Any],""",
                  """                            guard let decryptedDictionary = Self.ss_parsePlistOrJSON(decryptedData),""",
              ),
              (
                  "4a. client dictionary: locale comes from the anisette server",
                  """                "loc": Locale.current.identifier,""",
                  """                "loc": anisetteData.locale.identifier,""",
              ),
              (
                  "4b. client dictionary: X-Apple-Locale from the anisette server",
                  """                "X-Apple-Locale": Locale.current.identifier,""",
                  """                "X-Apple-Locale": anisetteData.locale.identifier,""",
              ),
              (
                  "4c. client dictionary: time zone from the anisette server",
                  """                "X-Apple-I-TimeZone": TimeZone.current.abbreviation() ?? "PST\"""",
                  """                "X-Apple-I-TimeZone": anisetteData.timeZone.abbreviation() ?? "PST\"""",
              ),
              (
                  "5a. two-factor request: current Xcode version",
                  """            "X-Xcode-Version": "11.2 (11B41)",""",
                  """            "X-Xcode-Version": "%s",""" % OFFICIAL_XCODE_VERSION,
              ),
              (
                  "5b. two-factor request: add serial number + Connection: close",
                  """            "X-Apple-Locale": anisetteData.locale.identifier,
                      "X-Apple-I-TimeZone": anisetteData.timeZone.abbreviation() ?? "PST"
                  ]""",
                  """            "X-Apple-Locale": anisetteData.locale.identifier,
                      "X-Apple-I-TimeZone": anisetteData.timeZone.abbreviation() ?? "PST",
                      "X-Apple-I-SRL-NO": anisetteData.deviceSerialNumber,
                      "Connection": "close"
                  ]""",
              ),
          ]


          def main():
              mode = os.environ.get("PATCH_MODE", "official")
              if mode == "none":
                  print("= control build requested: AltSign left untouched")
                  return 0

              if not os.path.isfile(TARGET):
                  print("ERROR: %s not found (run me from the repo root)" % TARGET)
                  return 1

              with open(TARGET, encoding="utf-8") as f:
                  src = f.read()
              original = src

              # Own extension (not the private one) so the two helpers are plain
              # fileprivate members callable from every other extension in this file.
              anchor = "private extension ALTAppleAPI {\n    func sendAuthenticationRequest("
              if src.count(anchor) != 1:
                  print("ERROR: expected exactly one private-extension anchor, found %d" % src.count(anchor))
                  return 1
              helper_block = "extension ALTAppleAPI {\n" + HELPERS + "}\n\n"
              src = src.replace(anchor, helper_block + anchor)
              print("+ inserted ss_parsePlistOrJSON / ss_diagnosticError helpers")

              failures = []
              for label, old, new in REPLACEMENTS:
                  count = src.count(old)
                  if count != 1:
                      failures.append("%s -> expected 1 match, found %d" % (label, count))
                      print("! %s: expected 1 match, found %d" % (label, count))
                  else:
                      src = src.replace(old, new)
                      print("+ %s" % label)

              if failures:
                  print("\nERROR: %d replacement(s) did not apply:" % len(failures))
                  for f in failures:
                      print("  - %s" % f)
                  return 1

              if src == original:
                  print("ERROR: nothing changed")
                  return 1

              with open(TARGET, "w", encoding="utf-8") as f:
                  f.write(src)

              braces = src.count("{") - src.count("}")
              parens = src.count("(") - src.count(")")
              print("  braces balance %d, parens balance %d" % (braces, parens))
              print("  old UA left: %d | new UA present: %d" % (
                  src.count("akd/1.0 CFNetwork"),
                  src.count(OFFICIAL_UA),
              ))
              print("= patched %s" % TARGET)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          python3 "$RUNNER_TEMP/fix_altsign.py"
          git -C Dependencies/AltSign --no-pager diff --stat
      - name: Show patch
        run: git --no-pager diff

      # SideStore's Xcode build phase runs Dependencies/*/fetch-prebuilt.sh,
      # which pulls em_proxy.swift + libem_proxy-*.a + em_proxy.h from
      # releases/latest. That release (v0.9.3) no longer ships those files, so
      # wget writes 404 pages over them -> "module 'em_proxy' has no member
      # named 'start_em_proxy'". Neutralise the fetchers, then pin the real
      # files from the em_proxy release that matches 0.6.3 (tag "build").
      - name: Pin em_proxy prebuilt (and stop the auto-fetch clobbering it)
        run: |
          set -euo pipefail

          # 1. Neutralise every fetch-prebuilt.sh so nothing gets overwritten.
          for f in Dependencies/*/fetch-prebuilt.sh; do
            [ -f "$f" ] || continue
            printf '#!/usr/bin/env bash\necho "[ci] %s disabled: prebuilt files are pinned."\nexit 0\n' "$f" > "$f"
            chmod +x "$f"
            echo "disabled: $f"
          done

          # 2. Skip markers in every directory the script might be invoked from.
          mkdir -p SideStore
          touch .skip-prebuilt-fetch-em_proxy \
                SideStore/.skip-prebuilt-fetch-em_proxy \
                Dependencies/em_proxy/.skip-prebuilt-fetch-em_proxy

          # 3. Fetch the real artifacts; keep the submodule's own em_proxy.swift.
          cd Dependencies/em_proxy
          for f in libem_proxy-ios.a libem_proxy-sim.a em_proxy.h; do
            curl -fL -o "$f" "$EM_PROXY_BASE/$f" || { echo "ERROR: download failed: $f"; exit 1; }
          done

          # 4. Make sure we did not just save a 404 page.
          for f in libem_proxy-ios.a libem_proxy-sim.a em_proxy.h; do
            if head -c 400 "$f" | grep -qiE '<!doctype|<html|404: not found'; then
              echo "ERROR: $f is an error page, not a real artifact"
              head -c 400 "$f"
              exit 1
            fi
          done

          # 5. Symbol sanity check. The naming here is asymmetric and it is
          #    exactly what killed the two previous runs:
          #      em_proxy.h     -> Rust/C names:  start_emotional_damage / stop_emotional_damage
          #      em_proxy.swift -> Swift wrapper: start_em_proxy         / stop_em_proxy
          #    So do NOT grep for start_em_proxy in the header.
          grep -q "start_emotional_damage" em_proxy.h || {
            echo "ERROR: em_proxy.h has no start_emotional_damage"; sed -n '1,40p' em_proxy.h; exit 1; }
          grep -q "stop_emotional_damage" em_proxy.h || {
            echo "ERROR: em_proxy.h has no stop_emotional_damage"; sed -n '1,40p' em_proxy.h; exit 1; }
          grep -q "start_em_proxy" em_proxy.swift || {
            echo "ERROR: em_proxy.swift has no start_em_proxy"; sed -n '1,40p' em_proxy.swift; exit 1; }

          # 6. The .a files are fat Mach-O archives (magic cafebabe), NOT ar
          #    archives (magic !<arch>), so only check a size floor and print
          #    what they actually are for later diagnosis.
          for f in libem_proxy-ios.a libem_proxy-sim.a; do
            file "$f" || true
            lipo -info "$f" || true
            size=$(wc -c < "$f" | tr -d ' ')
            echo "$f size=$size bytes"
            [ "$size" -gt 1000000 ] || { echo "ERROR: $f suspiciously small"; head -c 200 "$f"; exit 1; }
          done

          echo "em_proxy OK:"
          ls -la libem_proxy-ios.a libem_proxy-sim.a em_proxy.h em_proxy.swift

      - name: Install build tools
        run: brew install ldid xcbeautify

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ inputs.xcode || '26.4' }}

      - name: Xcode version
        run: xcodebuild -version

      - name: Build archive
        run: |
          set -o pipefail
          make -B build 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            echo "===== ERROR LINES ====="
            grep -nE "error:|fatal error:|No such module|errors? generated" "$RUNNER_TEMP/build.log" | head -40
            echo "===== MINIMUXER CHECK ====="
            ls -la Dependencies/minimuxer/RustBridge/lib/RustBridge.xcframework || echo "minimuxer xcframework MISSING"
            echo "===== EM_PROXY RECHECK ====="
            ls -la Dependencies/em_proxy/
            grep -n "start_em_proxy" Dependencies/em_proxy/em_proxy.swift || echo "em_proxy.swift CLOBBERED"
            exit 1
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Inspect archive before fakesign
        run: |
          set -uo pipefail
          APP=SideStore.xcarchive/Products/Applications/SideStore.app
          echo "===== APP DIR ====="
          ls -la "$APP" || { echo "ERROR: $APP missing"; exit 1; }
          echo "===== FRAMEWORKS ====="
          ls -la "$APP/Frameworks" || echo "(no Frameworks dir)"
          echo "===== PLUGINS ====="
          ls -la "$APP/PlugIns" || echo "(no PlugIns dir)"

      - name: Fakesign (ldid)
        run: make fakesign

      - name: Package IPA
        run: |
          set -euo pipefail
          make ipa
          test -f SideStore.ipa || { echo "ERROR: make ipa did not produce SideStore.ipa"; exit 1; }
          cp SideStore.ipa "$IPA_NAME"
          ls -lh "$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Publish Release
        if: ${{ (inputs.publish_release || 'true') == 'true' }}
        continue-on-error: true
        run: |
          if gh release view "$VARIANT_TAG" >/dev/null 2>&1; then
            gh release upload "$VARIANT_TAG" "$IPA_NAME" --clobber
          else
            gh release create "$VARIANT_TAG" \
              --target main \
              --title "SideStore 0.6.3 (patch mode: $PATCH_MODE)" \
              --notes "构建变体 patch_mode=$PATCH_MODE。official = 官方 client info/UA（macOS 26.6 / Xcode 26.0）+ 抗崩改造 + 清除旧 adi.pb；server = 仅抗崩改造、沿用服务器下发值；none = 未改动的 0.6.3 对照包。" \
              "$IPA_NAME"
          fi
